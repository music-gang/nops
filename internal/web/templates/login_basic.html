{{define "login_basic"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nops</title>
<link rel="stylesheet" href="{{asset "app.css"}}">
</head>
<body>
<main class="login-page">
  <form class="login-card" method="post" action="/auth/login">
    <h1 class="login-card__title">nops</h1>
    {{if .Error}}<p class="login-card__error">{{.Error}}</p>{{end}}
    <input type="hidden" name="next" value="{{.Next}}">
    <label class="login-card__field">Username
      <input type="text" name="username" autocomplete="username" autofocus required>
    </label>
    <label class="login-card__field">Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn--primary">Log in</button>
  </form>
</main>
</body>
</html>
{{end}}
