{{define "login"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Nops</title>
{{template "head_icons" .}}
<link rel="stylesheet" href="{{.Base}}{{asset "app.css"}}">
</head>
<body>
<main class="login">
  <img class="login__logo" src="{{.Base}}{{asset "logo-192x192.png"}}" alt="" width="96" height="96">
  <h1 class="login__title">Sign in to Nops</h1>
  {{if .Error}}<p class="login__error">{{.Error}}</p>{{end}}
  {{if eq .Method "basic"}}
  <form class="login__box" method="post" action="{{.Base}}/auth/basic">
    <input type="hidden" name="next" value="{{.Next}}">
    <label class="login__field">Username
      <input type="text" name="username" autocomplete="username" autofocus required>
    </label>
    <label class="login__field">Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn--primary">Log in</button>
  </form>
  {{else}}
  <div class="login__box"><a class="btn btn--primary" href="{{.Base}}/auth/oidc?next={{.Next | urlquery}}">Log in with your identity provider</a></div>
  {{end}}
  <p class="login__or"><span>or</span></p>
  <form class="login__box" method="post" action="{{.Base}}/auth/token">
    <input type="hidden" name="next" value="{{.Next}}">
    <label class="login__field">Token
      <input type="password" name="token" autocomplete="off" required>
    </label>
    <button type="submit" class="btn">Use a token</button>
  </form>
</main>
</body>
</html>
{{end}}
