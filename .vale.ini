# Prose linting with the Google developer documentation style guide:
# docs/development.md#writing-docs. `vale sync` downloads the package.
StylesPath = .vale
MinAlertLevel = warning
Vocab = Nops
# Monospace spans in the dashboard hold code, as backticks do in Markdown.
IgnoredClasses = mono

[*.md]
BasedOnStyles = Vale, Google

# The changelog's headings are versions, not sentences.
[CHANGELOG.md]
Google.Headings = NO

# History, no longer edited.
[docs/archive/*.md]
BasedOnStyles =

# The dashboard's prose. Template actions are code, not text. Vale wraps
# what it ignores in markup, so only actions outside a tag are matched: one
# inside a tag would break the tag.
[internal/web/templates/*.html]
BasedOnStyles = Vale, Google
BlockIgnores = (?s)(\{\{/\*.*?\*/\}\})
TokenIgnores = (\{\{[^{}]*\}\}(?=[^<>]*(?:<|\z)))
