name: PR title

# main is squash-merge only, so the PR title becomes the commit subject on main.
# Keep it in Angular style: type(scope): subject. The title also says whether
# the PR needs a line in CHANGELOG.md (the changelog job below).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # The subject starts lowercase, has no trailing period and is <= 72 chars.
          subjectPattern: ^(?=.{1,72}$)[a-z0-9](?:.*[^.])?$
          subjectPatternError: |
            The subject "{subject}" in the PR title must start with a lowercase
            letter or digit, must not end with a period, and must be at most 72
            characters long.

  # A feat, a fix or a breaking change adds its line to CHANGELOG.md
  # (docs/development.md#changelog). pull_request_target checks out the base
  # branch, never the PR's code: the script that runs is main's, and the PR's
  # patch is only read as text.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CHANGELOG.md has the PR's line
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" \
            --jq '.[] | select(.filename == "CHANGELOG.md") | .patch // ""' >"$RUNNER_TEMP/patch"
          scripts/changelog.sh check-pr "$TITLE" <"$RUNNER_TEMP/patch"
