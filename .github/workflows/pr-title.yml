name: PR title

# main is squash-merge only, so the PR title becomes the commit subject on main.
# Keep it in Angular style: type(scope): subject.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # The subject starts lowercase, has no trailing period and is <= 72 chars.
          subjectPattern: ^(?=.{1,72}$)[a-z0-9](?:.*[^.])?$
          subjectPatternError: |
            The subject "{subject}" in the PR title must start with a lowercase
            letter or digit, must not end with a period, and must be at most 72
            characters long.
