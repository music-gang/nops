name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go build ./...
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - run: go test -race -cover ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned version: bump it by hand (Dependabot does not track `go run` targets).
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -tags integration ./...
      # scripts/release.sh cuts the releases, scripts/changelog.sh reads
      # CHANGELOG.md for it and for the PR check; shellcheck is preinstalled on
      # the runner.
      - name: release scripts
        run: |
          shellcheck -x scripts/*.sh
          bash scripts/release_test.sh
          bash scripts/changelog_test.sh
      # A broken .goreleaser.yaml fails here, not when a release is tagged.
      # Same pinned version as release.yml: bump both by hand.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: check

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The Nomad nops is tested against: the one place the version is set. The
      # README states it too (a test in docs/ compares the two).
      NOMAD_VERSION: "2.0.7"
      NOMAD_SHA256: 4c9b8a0850d6fd9caadbbab09b3e6fdf8b77aa777729543c70c61b85acca68c1
      NOPS_TEST_NOMAD_ADDR: http://127.0.0.1:4646
      # A second agent, with ACLs, for what the token needs (acl_test.go).
      NOPS_TEST_NOMAD_ACL_ADDR: http://127.0.0.1:5646
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Nomad
        run: |
          zip="nomad_${NOMAD_VERSION}_linux_amd64.zip"
          curl -sSfLO "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/${zip}"
          echo "${NOMAD_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "${zip}" nomad
          sudo install -m 0755 nomad /usr/local/bin/nomad
          nomad version
      - name: Start Nomad dev agent
        run: |
          nomad agent -dev -bind=127.0.0.1 > nomad.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf "${NOPS_TEST_NOMAD_ADDR}/v1/nodes" | grep -q '"Status":"ready"'; then
              echo "Nomad is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Nomad did not become ready in time"
          cat nomad.log
          exit 1
      - name: Start Nomad dev agent with ACLs
        run: |
          printf 'ports {\n  http = 5646\n  rpc  = 5647\n  serf = 5648\n}\nacl {\n  enabled = true\n}\n' > acl-agent.hcl
          nomad agent -dev -bind=127.0.0.1 -config=acl-agent.hcl > nomad-acl.log 2>&1 &
          # The step's shell has no pipefail: the pipeline's status is jq's, so
          # the loop looks at the token, not at the status.
          token=""
          for _ in $(seq 1 60); do
            token=$(curl -sf -X POST "${NOPS_TEST_NOMAD_ACL_ADDR}/v1/acl/bootstrap" | jq -r '.SecretID // empty')
            if [ -n "${token}" ]; then break; fi
            sleep 1
          done
          if [ -z "${token}" ]; then
            echo "The ACL agent could not be bootstrapped in time"
            cat nomad-acl.log
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "NOPS_TEST_NOMAD_ACL_TOKEN=${token}" >> "${GITHUB_ENV}"
          for _ in $(seq 1 60); do
            if curl -sf -H "X-Nomad-Token: ${token}" "${NOPS_TEST_NOMAD_ACL_ADDR}/v1/nodes" | grep -q '"Status":"ready"'; then
              echo "Nomad with ACLs is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Nomad with ACLs did not become ready in time"
          cat nomad-acl.log
          exit 1
      - name: Integration tests
        run: go test -tags integration -race -count=1 -v ./tests/integration/...
      - name: Nomad log
        if: failure()
        run: |
          tail -n 200 nomad.log
          if [ -f nomad-acl.log ]; then tail -n 200 nomad-acl.log; fi
