name: release

# A vX.Y.Z tag pushed on a commit of main publishes the release: the image on
# ghcr.io/music-gang/nops and the binary, checksums and changelog on the
# GitHub Release. How to cut one: docs/development.md#releasing.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the GitHub Release and its assets
      packages: write # the image on GHCR
    env:
      # Pinned version: bump it by hand (Dependabot does not track it).
      GORELEASER_VERSION: v2.18.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog reads the history since the previous tag
          persist-credentials: false
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main: releases are cut from main only"
            exit 1
          fi
      # The BREAKING CHANGE footers since the last final tag, the same text
      # scripts/release.sh shows before the tag. goreleaser puts it above the
      # changelog.
      - name: Upgrade notes
        id: notes
        run: |
          . scripts/release.sh
          if last=$(last_release "$GITHUB_SHA^") && [ -n "$last" ]; then
            range="$last..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi
          file="$RUNNER_TEMP/upgrade-notes.md"
          git log -z --reverse --format='%h%x09%s%n%b' "$range" | upgrade_notes >"$file"
          if [ -s "$file" ]; then
            cat "$file"
            echo "args=--release-header $file" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build everything once without publishing and try the image before
      # anything is pushed: a snapshot loads it locally, tagged <version>-amd64.
      - name: Snapshot build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
      - name: Image smoke test
        run: |
          image="$(docker image ls --format '{{.Repository}}:{{.Tag}}' ghcr.io/music-gang/nops | grep -- '-SNAPSHOT-.*-amd64$' | head -n 1)"
          if [ -z "$image" ]; then
            echo "the snapshot built no image"
            docker image ls
            exit 1
          fi
          got="$(docker run --rm "$image" -version)"
          if [ "$got" != "$GITHUB_REF_NAME" ]; then
            echo "$image -version printed '$got', want '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "$image reports $got"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
