name: Bug report
description: Something does not behave as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The job HCL (redact secrets), the `nops_*` meta keys involved, and the steps.
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Versions
      description: nops version or commit, Nomad version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines (redact secrets). Include the `deployment_id` if there is one.
      render: text
    validations:
      required: false
